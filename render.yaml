services:
  - type: web
    name: trustcue-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn trustcue_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "false"
      - key: DOCS_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_CLOUD_AI
        value: "true"
      - key: ENABLE_CLOUD_AUTH
        value: "true"
      - key: ENABLE_CLOUD_SYNC
        value: "true"
      - key: SUPABASE_URL
        value: https://yzqkmoqqvnhfmmrayfko.supabase.co
      - key: SUPABASE_JWKS_URL
        value: https://yzqkmoqqvnhfmmrayfko.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWT_ALGORITHMS
        value: '["ES256"]'
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWT_ISSUER
        value: https://yzqkmoqqvnhfmmrayfko.supabase.co/auth/v1
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
