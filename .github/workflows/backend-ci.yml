name: Backend CI

on:
  push:
    branches:
      - backend
      - main
    paths:
      - 'backend/**'
      - 'render.yaml'
      - 'Dockerfile'
      - 'Procfile'
      - '.python-version'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - backend
      - main
    paths:
      - 'backend/**'
      - 'render.yaml'
      - 'Dockerfile'
      - 'Procfile'
      - '.python-version'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Backend Lint, Contract & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -e backend

      - name: Run Ruff Lint
        run: ruff check backend/src backend/tests

      - name: Validate OpenAPI 3.1 Specification
        run: python -m openapi_spec_validator backend/contracts/openapi.yaml

      - name: Run Automated Pytest Suite
        run: pytest backend/tests -v
