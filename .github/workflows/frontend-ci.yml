name: Frontend CI

on:
  push:
    branches:
      - frontend
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - frontend
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality-and-tests:
    name: Flutter Lint, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Toolchain
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get --enforce-lockfile

      - name: Check Code Formatting
        run: |
          dart format --output=none --set-exit-if-changed frontend/lib frontend/test frontend/integration_test

      - name: Analyze Flutter Codebase
        run: |
          cd frontend
          flutter analyze --no-pub

      - name: Run Automated Test Suite
        run: |
          cd frontend
          flutter test --no-pub --reporter expanded

      - name: Configure Android SDK Licenses & NDK
        run: |
          export ANDROID_SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sudo install -d -m 0777 "$ANDROID_SDK_DIR/licenses" "$ANDROID_SDK_DIR/ndk"
          # Handle pipe/SIGPIPE explicitly without failing or emitting broken pipe warnings
          set +o pipefail
          yes 2>/dev/null | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses
          echo "Installing pinned Android NDK 30.0.16138531..."
          yes 2>/dev/null | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16138531"
          set -o pipefail
          # Verify that required NDK revision exists and fail explicitly if missing
          if [ ! -d "$ANDROID_SDK_DIR/ndk/30.0.16138531" ]; then
            echo "ERROR: Required NDK 30.0.16138531 was not installed at $ANDROID_SDK_DIR/ndk/30.0.16138531" >&2
            exit 1
          fi
          echo "Successfully verified Android NDK 30.0.16138531 installation."


      - name: Verify Debug APK Build
        run: |
          cd frontend
          flutter build apk --debug --no-pub -t lib/main.dart


